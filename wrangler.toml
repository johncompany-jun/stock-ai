name = "stock-ai"
main = "src/server/index.ts"
compatibility_date = "2025-01-01"

# カスタムドメイン (stock-ai.uk) binding は Cloudflare ダッシュボード側で既に設定済み。
# CI の GitHub Secrets トークンに Zone 権限がないため、wrangler.toml 側では管理せず
# 403 で CI が赤くなるのを回避する。ドメイン設定を変える時は dashboard から行うか、
# 必要に応じて [[routes]] セクションを一時的に復活させる。

[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"
run_worker_first = true
binding = "ASSETS"

[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "stock-ai"
database_id = "a40fd260-c66d-433d-9739-2e8222304033"
migrations_dir = "drizzle"

[triggers]
# 00:05 UTC = 09:05 JST 同日。9:00 JST エントリー足 (= 00:00 UTC) が揃った直後に配信。
# Cloudflare の cron パーサーは DoW の数値ゼロを受け付けないため名前で指定。
crons = ["5 0 * * MON,TUE,WED,THU,FRI"]
