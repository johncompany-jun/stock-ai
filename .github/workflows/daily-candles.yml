name: Daily candles update

on:
  schedule:
    # JST 01:00 = UTC 16:00 (東証大引け 15:00 JST + 反映余裕)
    - cron: "0 16 * * *"
  workflow_dispatch:

concurrency:
  group: daily-candles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_URL: https://stock-ai.uk
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Fetch daily candles (diff mode) and apply to remote D1
        run: bun run scripts/fetch-candles.ts --remote --apply

      - name: Predict (SMA cross) all stocks and apply to remote D1
        run: >
          bun run scripts/predict-all.ts
          --model sma_cross_v1
          --sourceUrl "$SOURCE_URL"
          --days 365 --chunk 200
          --apply --remote

      - name: Predict (RSI reversal) all stocks and apply to remote D1
        run: >
          bun run scripts/predict-all.ts
          --model rsi_reversal_v1
          --sourceUrl "$SOURCE_URL"
          --days 365 --chunk 200
          --apply --remote

      - name: Predict (Volume breakout) all stocks and apply to remote D1
        run: >
          bun run scripts/predict-all.ts
          --model volume_breakout_v1
          --sourceUrl "$SOURCE_URL"
          --days 365 --chunk 200
          --apply --remote

      - name: Summary
        if: always()
        run: |
          bunx wrangler d1 execute stock-ai --remote --command \
            "SELECT COUNT(DISTINCT code) AS codes, COUNT(*) AS rows, MAX(date) AS latest FROM candles"
          bunx wrangler d1 execute stock-ai --remote --command \
            "SELECT model_name, COUNT(*) AS n, MAX(run_at) AS latest_run FROM predictions GROUP BY model_name"
