name: Daily candles update

on:
  schedule:
    # JST 01:00 = UTC 16:00 (東証大引け 15:00 JST + 反映余裕)
    - cron: "0 16 * * *"
  workflow_dispatch:

concurrency:
  group: daily-candles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_URL: https://stock-ai.uk
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Fetch daily candles (diff mode) and apply to remote D1
        run: bun run scripts/fetch-candles.ts --remote --apply

      - name: Snapshot today's pattern picks (Top 5)
        run: >
          bun run scripts/pattern-save.ts
          --sourceUrl "$SOURCE_URL"
          --days 1
          --apply --remote

      - name: Backfill pattern_picks actuals (5/15/30d)
        run: bun run scripts/pattern-backfill.ts --remote --apply

      - name: Summary
        if: always()
        run: |
          bunx wrangler d1 execute stock-ai --remote --command \
            "SELECT COUNT(DISTINCT code) AS codes, COUNT(*) AS rows, MAX(date) AS latest FROM candles"
          bunx wrangler d1 execute stock-ai --remote --command \
            "SELECT COUNT(*) AS picks, SUM(CASE WHEN return_30d_pct IS NOT NULL THEN 1 ELSE 0 END) AS with_30d, ROUND(AVG(return_30d_pct),3) AS avg_30d, ROUND(100.0 * SUM(CASE WHEN return_30d_pct > 0 THEN 1 ELSE 0 END) / NULLIF(COUNT(return_30d_pct),0), 2) AS wr_30d FROM pattern_picks"
