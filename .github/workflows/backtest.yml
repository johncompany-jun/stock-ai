name: Backtest all models

on:
  schedule:
    # JST 日曜 06:00 = UTC 土曜 21:00 (daily-candles は UTC 16:00 なので干渉なし)
    - cron: "0 21 * * 6"
  workflow_dispatch:
    inputs:
      stocks:
        description: "Sample stocks count"
        default: "50"
      dates:
        description: "Run dates per stock"
        default: "30"
      seed:
        description: "RNG seed (blank on cron → weekly-rotating seed for sample accumulation)"
        default: ""
      skip_lstm:
        description: "Skip LSTM (slowest; skip for a fast SMA/RSI/Volume refresh)"
        type: boolean
        default: false

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_URL: https://stock-ai.uk
      STOCKS: ${{ inputs.stocks || '50' }}
      DATES: ${{ inputs.dates || '30' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Resolve SEED
        run: |
          if [ -n "${{ inputs.seed }}" ]; then
            echo "SEED=${{ inputs.seed }}" >> "$GITHUB_ENV"
          else
            # cron / blank input: rotate weekly (ISO year+week) so each run picks a fresh sample
            SEED="$(date -u +%G%V)"
            echo "SEED=$SEED" >> "$GITHUB_ENV"
            echo "using weekly-rotating SEED=$SEED"
          fi

      - name: Backtest (SMA cross)
        run: >
          bun run scripts/backtest.ts
          --model=sma_cross_v1
          --sourceUrl "$SOURCE_URL"
          --stocks "$STOCKS" --dates "$DATES" --seed "$SEED"
          --out data/backtest_sma.sql --apply --remote

      - name: Backtest (RSI reversal)
        run: >
          bun run scripts/backtest.ts
          --model=rsi_reversal_v1
          --sourceUrl "$SOURCE_URL"
          --stocks "$STOCKS" --dates "$DATES" --seed "$SEED"
          --out data/backtest_rsi.sql --apply --remote

      - name: Backtest (Volume breakout)
        run: >
          bun run scripts/backtest.ts
          --model=volume_breakout_v1
          --sourceUrl "$SOURCE_URL"
          --stocks "$STOCKS" --dates "$DATES" --seed "$SEED"
          --out data/backtest_volume.sql --apply --remote

      - name: Backtest (LSTM)
        if: ${{ !inputs.skip_lstm }}
        run: >
          bun run scripts/backtest.ts
          --model=lstm_v1
          --sourceUrl "$SOURCE_URL"
          --stocks "$STOCKS" --dates "$DATES" --seed "$SEED"
          --out data/backtest_lstm.sql --apply --remote

      - name: Summary
        if: always()
        run: |
          bunx wrangler d1 execute stock-ai --remote --command \
            "SELECT model_name, COUNT(*) AS n, COUNT(DISTINCT code) AS stocks, COUNT(DISTINCT run_date) AS run_dates FROM prediction_log GROUP BY model_name"
