name: Daily FX candles update

on:
  schedule:
    # JST 07:00 = UTC 22:00 前日 (平日、8:30 予測に間に合わせる)
    - cron: "0 22 * * 0-4"
  workflow_dispatch:
    inputs:
      daysBack:
        description: "How many days to fetch from yfinance"
        default: "7"

concurrency:
  group: daily-fx-candles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Update USD/JPY minute candles from yfinance and apply to remote D1
        run: >
          bun run scripts/fx-update-yfinance.ts
          --pair USDJPY --symbol "JPY=X"
          --daysBack ${{ inputs.daysBack || '7' }}
          --remote

      - name: Summary
        if: always()
        run: |
          bunx wrangler d1 execute stock-ai --remote --command \
            "SELECT pair, COUNT(*) AS n, datetime(MIN(timestamp_utc), 'unixepoch') AS min_utc, datetime(MAX(timestamp_utc), 'unixepoch') AS max_utc FROM fx_candles GROUP BY pair"
