name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # 既存の 0008-0014 は wrangler の d1_migrations tracker に記録されていないが
      # テーブルは本番 D1 に既に存在する (手動投入の履歴)。tracker を使わず、
      # 新規マイグレーションのみ idempotent (IF NOT EXISTS) に直接実行する。
      - name: Apply new D1 migrations (remote)
        run: |
          bunx wrangler d1 execute stock-ai --remote --file=drizzle/0015_add_waitlist.sql
          bunx wrangler d1 execute stock-ai --remote --file=drizzle/0016_add_contacts.sql

      - name: Build client (Tailwind CSS + Vite)
        run: bun run build

      - name: Deploy to Cloudflare Workers
        run: bunx wrangler deploy
