name: Daily LSTM predictions

on:
  workflow_run:
    workflows: ["Daily candles update"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      limit:
        description: "Max stocks per shard (blank = all)"
        default: ""
      shards:
        description: "Total shard count (parallel jobs)"
        default: "4"

concurrency:
  group: daily-lstm
  cancel-in-progress: false

jobs:
  predict:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_URL: https://stock-ai.uk
      SHARDS: ${{ inputs.shards || '4' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Predict (LSTM) shard ${{ matrix.shard }}/${{ inputs.shards || '4' }} and apply to remote D1
        run: >
          bun run scripts/predict-all.ts
          --model lstm_v1
          --sourceUrl "$SOURCE_URL"
          --days 365 --chunk 200
          --shard "${{ matrix.shard }}/$SHARDS"
          ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
          --out data/seed_predictions_lstm_v1_shard${{ matrix.shard }}.sql
          --apply --remote

      - name: Summary
        if: always()
        run: |
          bunx wrangler d1 execute stock-ai --remote --command \
            "SELECT model_name, COUNT(*) AS n, datetime(MAX(run_at), 'unixepoch', '+9 hours') AS latest_jst FROM predictions WHERE model_name = 'lstm_v1' GROUP BY model_name"
