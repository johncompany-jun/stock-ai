services:
  app:
    build:
      context: .
      target: dev
    container_name: stock-ai
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - wrangler_state:/app/.wrangler
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

volumes:
  node_modules:
  wrangler_state:
